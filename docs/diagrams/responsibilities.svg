<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="20" font-weight="600" fill="#1F2A44">Who does what: a smart client, a server that never generates</text>
  <text x="40" y="68" font-size="13" fill="#55606E">Decisions: dogfood first, client does the LLM work, encrypted at rest with server-side search</text>

  <!-- Client -->
  <rect x="40" y="96" width="220" height="324" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="56" y="126" font-size="15" font-weight="600" fill="#1F2A44">Your LLM client</text>
  <text x="56" y="146" font-size="12" fill="#55606E">Claude, ChatGPT, Cursor</text>
  <g font-size="13" fill="#1F2A44">
    <text x="56" y="194">Distils and tags on write</text>
    <text x="56" y="226">Decides type and happened_at</text>
    <text x="56" y="258">Filters, then reads entries</text>
    <text x="56" y="290">Does all the analysis</text>
    <text x="56" y="322">Writes digests back</text>
  </g>

  <!-- Server -->
  <rect x="370" y="96" width="220" height="324" rx="8" fill="#EEF0F2" stroke="#3B3B3B" stroke-width="2"/>
  <text x="386" y="126" font-size="15" font-weight="600" fill="#1F2A44">Memento server</text>
  <text x="386" y="146" font-size="12" fill="#55606E">Django + Postgres. No text generation.</text>
  <g font-size="13" fill="#1F2A44">
    <text x="386" y="194">Validates required fields</text>
    <text x="386" y="226">Stores append-only</text>
    <text x="386" y="258">Full-text and tag search</text>
    <text x="386" y="290">Counts by week and tag</text>
    <text x="386" y="322">Holds due reminders</text>
    <text x="386" y="354">Hard-deletes on request</text>
  </g>

  <!-- You -->
  <rect x="700" y="96" width="220" height="324" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="716" y="126" font-size="15" font-weight="600" fill="#1F2A44">You</text>
  <text x="716" y="146" font-size="12" fill="#55606E">Pushed to you, outside MCP</text>
  <g font-size="13" fill="#1F2A44">
    <text x="716" y="194">Morning email of due items</text>
    <text x="716" y="226">On this day, a year ago</text>
    <text x="716" y="258">Read-only web timeline</text>
  </g>

  <!-- Client <-> server arrows -->
  <text x="315" y="182" font-size="11" fill="#1F2A44" text-anchor="middle">remember</text>
  <line x1="262" y1="190" x2="366" y2="190" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="315" y="238" font-size="11" fill="#1F2A44" text-anchor="middle">recall, timeline</text>
  <line x1="368" y1="246" x2="264" y2="246" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="315" y="302" font-size="11" fill="#B7791F" text-anchor="middle">digest + source ids</text>
  <line x1="262" y1="310" x2="366" y2="310" stroke="#B7791F" stroke-width="2" marker-end="url(#ahA)"/>

  <!-- Server -> You -->
  <text x="645" y="210" font-size="11" fill="#1F2A44" text-anchor="middle">daily cron</text>
  <line x1="592" y1="218" x2="696" y2="218" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Reflection loop note -->
  <rect x="40" y="448" width="880" height="62" fill="#FBF3E4"/>
  <rect x="40" y="448" width="4" height="62" fill="#B7791F"/>
  <text x="58" y="472" font-size="13" font-weight="600" fill="#5C3D0B">The reflection loop</text>
  <text x="58" y="494" font-size="13" fill="#5C3D0B">The client reads a month of entries and writes a digest that cites their ids. Longitudinal analysis compounds without any model on the server.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
  </defs>
  <rect width="960" height="706" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-weight="600" fill="#1F2A44">Memento data model: entries, citations and captures</text>
  <text x="40" y="66" font-size="13" fill="#55606E">Validated against Postgres 16 and Django 6.1, with 43 tests mapped to the brief's principles</text>

  <!-- User -->
  <rect x="40" y="95" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
  <text x="56" y="120" font-size="14" font-weight="600" fill="#1F2A44">User</text>
  <text x="56" y="140" font-size="12" fill="#55606E">Django auth</text>
  <text x="224" y="112" font-size="11" fill="#55606E" text-anchor="middle">owns</text>
  <line x1="190" y1="120" x2="258" y2="120" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Entry card -->
  <rect x="260" y="90" width="400" height="562" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
  <path d="M268,90 H652 A8,8 0 0 1 660,98 V130 H260 V98 A8,8 0 0 1 268,90 Z" fill="#1F2A44"/>
  <text x="276" y="116" font-size="15" font-weight="600" fill="#FFFFFF">Entry</text>
  <text x="644" y="116" font-size="12" fill="#D5DCE6" text-anchor="end">id uuid7, owner → User</text>

  <g font-size="13" fill="#1F2A44">
    <rect x="272" y="140" width="376" height="50" rx="4" fill="#FBF3E4" stroke="#B7791F" stroke-width="1.5"/>
    <text x="284" y="161" font-weight="600" font-size="12">The tattoo</text>
    <text x="430" y="161">raw_text</text>
    <text x="430" y="180" font-size="11" fill="#5C3D0B">immutable: save guard + DB trigger</text>

    <rect x="272" y="200" width="376" height="104" rx="4" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="284" y="222" font-weight="600" font-size="12">Derived by client</text>
    <text x="430" y="222">kind</text>
    <text x="430" y="242">claim (up to 280 chars)</text>
    <text x="430" y="262">tags[] (GIN indexed)</text>
    <text x="430" y="282">happened_at + precision</text>

    <rect x="272" y="314" width="376" height="46" rx="4" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="284" y="334" font-weight="600" font-size="12">Reminder</text>
    <text x="430" y="334">due_at, completed_at</text>
    <text x="430" y="352">notified_at</text>

    <rect x="272" y="370" width="376" height="46" rx="4" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="284" y="390" font-weight="600" font-size="12">Digest</text>
    <text x="430" y="390">covers_from, covers_to</text>
    <text x="430" y="408">sources → Citation</text>

    <rect x="272" y="426" width="376" height="46" rx="4" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="284" y="446" font-weight="600" font-size="12">Versions</text>
    <text x="430" y="446">supersedes + reason</text>
    <text x="430" y="464">valid_until</text>

    <rect x="272" y="482" width="376" height="46" rx="4" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="284" y="502" font-weight="600" font-size="12">Source</text>
    <text x="430" y="502">capture → Capture</text>
    <text x="430" y="520">external_ref, e.g. pocket:gai_1</text>

    <rect x="272" y="538" width="376" height="46" rx="4" fill="#EEF0F2" stroke="#9AA3AE"/>
    <text x="284" y="558" font-weight="600" font-size="12">Provenance</text>
    <text x="430" y="558">client_name (from token)</text>
    <text x="430" y="576">model_name, recorded_at</text>

    <rect x="272" y="594" width="376" height="46" rx="4" fill="#EEF0F2" stroke="#9AA3AE"/>
    <text x="284" y="614" font-weight="600" font-size="12">Search</text>
    <text x="430" y="614">generated tsvector</text>
    <text x="430" y="632">claim weight A, raw weight B</text>
  </g>

  <!-- Self loop: supersedes -->
  <path d="M272,449 H222 V250 H270" fill="none" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="212" y="316" font-size="12" font-weight="600" fill="#1F2A44" text-anchor="end">supersedes</text>
  <text x="212" y="334" font-size="11" fill="#55606E" text-anchor="end">correction or change,</text>
  <text x="212" y="350" font-size="11" fill="#55606E" text-anchor="end">one chain, no forks</text>

  <!-- Capture -->
  <line x1="272" y1="505" x2="214" y2="505" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="40" y="440" width="172" height="150" rx="6" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
  <text x="54" y="464" font-size="14" font-weight="600" fill="#5C3D0B">Capture</text>
  <g font-size="12" fill="#1F2A44">
    <text x="54" y="486">transcript, captured_at</text>
    <text x="54" y="504">immutable: DB trigger</text>
    <text x="54" y="526">revisions: append-only</text>
    <text x="54" y="548">hints: Pocket's reading</text>
    <text x="54" y="570">status: inbox, processed</text>
  </g>
  <text x="40" y="612" font-size="11" fill="#55606E">Plus PocketLink, IngestLog, and</text>
  <text x="40" y="628" font-size="11" fill="#55606E">Tombstone: ids and date only</text>

  <!-- Notes -->
  <rect x="700" y="95" width="220" height="118" rx="6" fill="#FFFFFF" stroke="#9AA3AE"/>
  <text x="714" y="118" font-size="13" font-weight="600" fill="#1F2A44">Enforced in Postgres</text>
  <g font-size="12" fill="#55606E">
    <text x="714" y="140">due_at only on reminders</text>
    <text x="714" y="159">Digests need a time window</text>
    <text x="714" y="178">Precision with happened_at</text>
    <text x="714" y="197">A change must say when</text>
  </g>

  <rect x="700" y="228" width="220" height="118" rx="6" fill="#FFFFFF" stroke="#9AA3AE"/>
  <text x="714" y="251" font-size="13" font-weight="600" fill="#1F2A44">Enforced in services</text>
  <g font-size="12" fill="#55606E">
    <text x="714" y="273">Digests must cite sources</text>
    <text x="714" y="292">Voice raw_text is an exact</text>
    <text x="714" y="311">excerpt of the transcript</text>
    <text x="714" y="330">Only solo notes in your voice</text>
  </g>

  <rect x="730" y="366" width="190" height="84" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
  <text x="746" y="390" font-size="14" font-weight="600" fill="#1F2A44">Citation</text>
  <text x="746" y="412" font-size="13" fill="#1F2A44">digest → Entry</text>
  <text x="746" y="432" font-size="13" fill="#1F2A44">source → Entry</text>
  <line x1="728" y1="400" x2="650" y2="400" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="700" y="470" width="220" height="160" fill="#FBF3E4"/>
  <rect x="700" y="470" width="4" height="160" fill="#B7791F"/>
  <text x="716" y="493" font-size="13" font-weight="600" fill="#5C3D0B">forget() cascades</text>
  <g font-size="12" fill="#5C3D0B">
    <text x="716" y="514">Every version in the chain, and</text>
    <text x="716" y="532">every digest citing any of them,</text>
    <text x="716" y="550">including digests of digests.</text>
    <text x="716" y="574">scope=source also removes the</text>
    <text x="716" y="592">voice note and all its entries.</text>
    <text x="716" y="616" font-weight="600">Tombstones stop re-sends.</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="671" width="18" height="14" fill="#FBF3E4" stroke="#B7791F"/>
  <text x="66" y="683" font-size="12" fill="#55606E">Sacred: never changes</text>
  <rect x="260" y="671" width="18" height="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-dasharray="4 3"/>
  <text x="286" y="683" font-size="12" fill="#55606E">Written by a client, rebuildable</text>
  <rect x="540" y="671" width="18" height="14" fill="#EEF0F2" stroke="#9AA3AE"/>
  <text x="566" y="683" font-size="12" fill="#55606E">Written by the server</text>
</svg>

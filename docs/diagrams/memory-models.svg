<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="830" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="600" fill="#1F2A44">No standard yet: four ways to model memory</text>
  <text x="40" y="66" font-size="13" fill="#55606E">What the unit of memory is, and what happens when something changes</text>

  <!-- Card template: label column x+16, value x+104 -->
  <!-- 1 Flat facts -->
  <g transform="translate(40,90)">
    <rect width="330" height="250" rx="8" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/>
    <text x="16" y="30" font-size="16" font-weight="600" fill="#1F2A44">Flat facts</text>
    <text x="16" y="50" font-size="12" fill="#55606E">ChatGPT memory, mem0, Open Memory Protocol</text>
    <g font-size="12" font-weight="600" fill="#55606E">
      <text x="16" y="88">Unit</text><text x="16" y="128">Time</text><text x="16" y="168">On change</text><text x="16" y="208">Raw kept</text>
    </g>
    <g font-size="13" fill="#1F2A44">
      <text x="104" y="88">A sentence about you</text>
      <text x="104" y="128">Created, updated stamps</text>
      <text x="104" y="168">Rewritten or deleted</text>
      <text x="104" y="208">No: the fact is</text><text x="104" y="226">the summary</text>
    </g>
  </g>

  <!-- 2 Blocks -->
  <g transform="translate(390,90)">
    <rect width="330" height="250" rx="8" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/>
    <text x="16" y="30" font-size="16" font-weight="600" fill="#1F2A44">Editable blocks</text>
    <text x="16" y="50" font-size="12" fill="#55606E">Letta (formerly MemGPT) core memory</text>
    <g font-size="12" font-weight="600" fill="#55606E">
      <text x="16" y="88">Unit</text><text x="16" y="128">Time</text><text x="16" y="168">On change</text><text x="16" y="208">Raw kept</text>
    </g>
    <g font-size="13" fill="#1F2A44">
      <text x="104" y="88">A labelled block the</text><text x="104" y="106">agent keeps in context</text>
      <text x="104" y="128">None: current state only</text>
      <text x="104" y="168">The agent rewrites it</text>
      <text x="104" y="208">No</text>
    </g>
  </g>

  <!-- 3 Graph -->
  <g transform="translate(40,360)">
    <rect width="330" height="250" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
    <text x="16" y="30" font-size="16" font-weight="600" fill="#1F2A44">Temporal graph</text>
    <text x="16" y="50" font-size="12" fill="#55606E">MCP memory server, Zep Graphiti</text>
    <g font-size="12" font-weight="600" fill="#55606E">
      <text x="16" y="88">Unit</text><text x="16" y="128">Time</text><text x="16" y="168">On change</text><text x="16" y="208">Raw kept</text>
    </g>
    <g font-size="13" fill="#1F2A44">
      <text x="104" y="88">Entities joined by facts</text>
      <text x="104" y="128">Two axes: when true,</text><text x="104" y="146">when learned</text>
      <text x="104" y="168">Old fact invalidated,</text><text x="104" y="186">never deleted</text>
      <text x="104" y="208">Yes, as episodes</text>
    </g>
  </g>

  <!-- 4 Stream -->
  <g transform="translate(390,360)">
    <rect width="330" height="250" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
    <text x="16" y="30" font-size="16" font-weight="600" fill="#1F2A44">Memory stream</text>
    <text x="16" y="50" font-size="12" fill="#55606E">Generative Agents (Stanford, 2023)</text>
    <g font-size="12" font-weight="600" fill="#55606E">
      <text x="16" y="88">Unit</text><text x="16" y="128">Time</text><text x="16" y="168">On change</text><text x="16" y="208">Raw kept</text>
    </g>
    <g font-size="13" fill="#1F2A44">
      <text x="104" y="88">A time-ordered</text><text x="104" y="106">observation</text>
      <text x="104" y="128">When it happened</text>
      <text x="104" y="168">A new observation</text><text x="104" y="186">is added</text>
      <text x="104" y="208">Yes; reflections cite</text><text x="104" y="226">their evidence</text>
    </g>
  </g>

  <!-- Memento -->
  <rect x="40" y="632" width="680" height="170" rx="8" fill="#1F2A44"/>
  <text x="60" y="662" font-size="16" font-weight="600" fill="#FFFFFF">Memento: a stream kept for you, not a profile kept about you</text>
  <g font-size="13" fill="#D5DCE6">
    <text x="60" y="690">Borrows the stream and cited reflections from Generative Agents,</text>
    <text x="60" y="708">and two time axes with invalidate-don't-delete from Graphiti.</text>
    <text x="60" y="734">A profile of you is just another digest, derived from the record.</text>
  </g>
  <rect x="60" y="750" width="640" height="38" rx="4" fill="#FBF3E4"/>
  <text x="74" y="774" font-size="13" fill="#5C3D0B"><tspan font-weight="600">Gap found: </tspan>"it was never true" and "it stopped being true" both use supersedes.</text>
</svg>

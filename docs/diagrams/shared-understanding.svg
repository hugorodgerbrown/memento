<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="840" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="600" fill="#1F2A44">Models will parse differently. Make the server the arbiter.</text>
  <text x="40" y="66" font-size="13" fill="#55606E">Four layers, from enforced to measured. Lower layers reach fewer clients but carry more.</text>

  <!-- Axis -->
  <line x1="24" y1="96" x2="24" y2="640" stroke="#9AA3AE" stroke-width="1.5"/>
  <text x="18" y="104" font-size="11" fill="#55606E" text-anchor="end" transform="rotate(-90 18 104)"></text>
  <text x="30" y="92" font-size="10" fill="#55606E">ENFORCED</text>
  <text x="30" y="656" font-size="10" fill="#55606E">MEASURED</text>

  <!-- Layer 1 -->
  <g transform="translate(40,100)">
    <rect width="680" height="120" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect width="8" height="120" rx="2" fill="#1F2A44"/>
    <text x="24" y="30" font-size="16" font-weight="600" fill="#1F2A44">1  The contract</text>
    <rect x="486" y="14" width="180" height="24" rx="12" fill="#1F2A44"/>
    <text x="576" y="31" font-size="12" fill="#FFFFFF" text-anchor="middle">Every client, any model</text>
    <text x="24" y="56" font-size="13" fill="#1F2A44">Schema, validation, and errors that teach. The server rejects what's wrong:</text>
    <text x="24" y="76" font-size="13" fill="#1F2A44">"yesterday" left in a claim, a memory dated in the future, a paraphrased excerpt.</text>
    <text x="24" y="96" font-size="13" fill="#1F2A44">Every result carries today's date in your time zone, so no client has to guess.</text>
    <text x="24" y="112" font-size="11" font-weight="600" fill="#2F6F8F">Guarantees what gets stored</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(40,240)">
    <rect width="680" height="100" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
    <rect width="8" height="100" rx="2" fill="#2F6F8F"/>
    <text x="24" y="30" font-size="16" font-weight="600" fill="#1F2A44">2  Tool text</text>
    <rect x="486" y="14" width="180" height="24" rx="12" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="576" y="31" font-size="12" fill="#1F2A44" text-anchor="middle">Every client, may truncate</text>
    <text x="24" y="56" font-size="13" fill="#1F2A44">The 500-character capture policy, field descriptions in the schema,</text>
    <text x="24" y="76" font-size="13" fill="#1F2A44">and hints in tool results.</text>
    <text x="24" y="92" font-size="11" font-weight="600" fill="#2F6F8F">Says when to save and how to fill each field</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(40,360)">
    <rect width="680" height="140" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect width="8" height="140" rx="2" fill="#7FA7BA"/>
    <text x="24" y="30" font-size="16" font-weight="600" fill="#1F2A44">3  The Memento skill</text>
    <rect x="486" y="14" width="180" height="24" rx="12" fill="#E6F0F4" stroke="#2F6F8F" stroke-dasharray="4 3"/>
    <text x="576" y="31" font-size="12" fill="#1F2A44" text-anchor="middle">Clients with Agent Skills</text>
    <text x="24" y="56" font-size="13" fill="#1F2A44">A SKILL.md in the open Agent Skills format, loaded only when needed.</text>
    <text x="24" y="76" font-size="13" fill="#1F2A44">Worked examples for splitting, kinds, tags, dates, correction vs change,</text>
    <text x="24" y="96" font-size="13" fill="#1F2A44">plus read-side recipes: trend questions, monthly digests, citing sources.</text>
    <text x="24" y="116" font-size="12" fill="#55606E">Claude, ChatGPT, Codex, Cursor, Copilot, Gemini CLI. Installed once per client.</text>
    <text x="24" y="132" font-size="11" font-weight="600" fill="#2F6F8F">Carries the house style: makes good entries consistent</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(40,520)">
    <rect width="680" height="120" rx="8" fill="#EEF0F2" stroke="#9AA3AE" stroke-width="1.5"/>
    <rect width="8" height="120" rx="2" fill="#9AA3AE"/>
    <text x="24" y="30" font-size="16" font-weight="600" fill="#1F2A44">4  Conformance</text>
    <rect x="486" y="14" width="180" height="24" rx="12" fill="#FFFFFF" stroke="#9AA3AE"/>
    <text x="576" y="31" font-size="12" fill="#1F2A44" text-anchor="middle">Offline, per client + model</text>
    <text x="24" y="56" font-size="13" fill="#1F2A44">The capture evals, run for each client, with and without the skill.</text>
    <text x="24" y="76" font-size="13" fill="#1F2A44">Every entry records its client and model, so quality is auditable per model.</text>
    <text x="24" y="92" font-size="13" fill="#1F2A44"></text>
    <text x="24" y="112" font-size="11" font-weight="600" fill="#2F6F8F">Proves convergence instead of assuming it</text>
  </g>

  <!-- Safety net -->
  <rect x="40" y="664" width="680" height="152" rx="8" fill="#FBF3E4"/>
  <rect x="40" y="664" width="4" height="152" fill="#B7791F"/>
  <text x="58" y="690" font-size="14" font-weight="600" fill="#5C3D0B">Two safety nets</text>
  <g font-size="13" fill="#5C3D0B">
    <text x="58" y="714"><tspan font-weight="600">Raw is sacred. </tspan>Variance only affects derived fields, and your words</text>
    <text x="58" y="732">are kept exactly, so a weak parse can be re-distilled later.</text>
    <text x="58" y="760"><tspan font-weight="600">Inbox fallback. </tspan>A client that misses the eval bar, or fails validation,</text>
    <text x="58" y="778">sends raw text to the inbox instead. One chosen distiller, itself just</text>
    <text x="58" y="796">another MCP client, structures it on a schedule. Nothing is lost.</text>
  </g>
</svg>

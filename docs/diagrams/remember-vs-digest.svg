<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
  </defs>
  <rect width="760" height="960" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="600" fill="#1F2A44">Your words in, Claude's words out</text>
  <text x="40" y="66" font-size="13" fill="#55606E">One message today, one question in October</text>

  <!-- Section 1 -->
  <text x="40" y="104" font-size="15" font-weight="600" fill="#2F6F8F">1  Today: you tell Claude</text>
  <rect x="40" y="116" width="680" height="54" rx="10" fill="#E6F0F4"/>
  <text x="58" y="139" font-size="14" font-style="italic" fill="#1F2A44">"woke up this morning and tendonitis is bad. played padel yesterdy</text>
  <text x="58" y="158" font-size="14" font-style="italic" fill="#1F2A44">for 90 minutes with Fred. Good sleep"</text>
  <text x="40" y="192" font-size="12" fill="#5C3D0B"><tspan font-weight="600">As written, this is not saved. </tspan>remember only fires when you ask: "log this", "remember".</text>

  <line x1="380" y1="200" x2="380" y2="222" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="392" y="215" font-size="12" fill="#1F2A44">remember × 3: one entry per observation</text>

  <!-- Cards -->
  <g font-size="12" fill="#1F2A44">
    <!-- Card 1 -->
    <g transform="translate(40,228)">
      <rect width="212" height="236" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
      <rect x="12" y="12" width="62" height="20" rx="10" fill="#E6F0F4"/><text x="43" y="26" text-anchor="middle" font-size="11">memory</text>
      <rect x="8" y="42" width="196" height="50" rx="4" fill="#FBF3E4"/>
      <text x="16" y="58" font-size="10" font-weight="600" fill="#5C3D0B">RAW, VERBATIM</text>
      <text x="16" y="74">woke up this morning and</text><text x="16" y="88">tendonitis is bad</text>
      <text x="16" y="114" font-size="10" font-weight="600" fill="#55606E">CLAIM</text>
      <text x="16" y="130">Tendonitis was bad on the</text><text x="16" y="146">morning of 11 Sep 2026</text>
      <text x="16" y="172" font-size="10" font-weight="600" fill="#55606E">HAPPENED</text>
      <text x="16" y="188">11 Sep 2026, day</text>
      <text x="16" y="212" font-size="10" font-weight="600" fill="#55606E">TAGS</text>
      <text x="16" y="228">health, tendonitis</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(274,228)">
      <rect width="212" height="236" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
      <rect x="12" y="12" width="62" height="20" rx="10" fill="#E6F0F4"/><text x="43" y="26" text-anchor="middle" font-size="11">memory</text>
      <rect x="8" y="42" width="196" height="50" rx="4" fill="#FBF3E4"/>
      <text x="16" y="58" font-size="10" font-weight="600" fill="#5C3D0B">RAW, VERBATIM</text>
      <text x="16" y="74">played padel <tspan font-weight="700" fill="#B7791F">yesterdy</tspan> for</text><text x="16" y="88">90 minutes with Fred</text>
      <text x="16" y="114" font-size="10" font-weight="600" fill="#55606E">CLAIM</text>
      <text x="16" y="130">Played 90 minutes of padel</text><text x="16" y="146">with Fred on 10 Sep 2026</text>
      <text x="16" y="172" font-size="10" font-weight="600" fill="#55606E">HAPPENED</text>
      <text x="16" y="188">10 Sep 2026, day</text>
      <text x="16" y="212" font-size="10" font-weight="600" fill="#55606E">TAGS</text>
      <text x="16" y="228">padel, exercise, person:fred</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(508,228)">
      <rect width="212" height="236" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
      <rect x="12" y="12" width="62" height="20" rx="10" fill="#E6F0F4"/><text x="43" y="26" text-anchor="middle" font-size="11">memory</text>
      <rect x="8" y="42" width="196" height="50" rx="4" fill="#FBF3E4"/>
      <text x="16" y="58" font-size="10" font-weight="600" fill="#5C3D0B">RAW, VERBATIM</text>
      <text x="16" y="74">Good sleep</text>
      <text x="16" y="114" font-size="10" font-weight="600" fill="#55606E">CLAIM</text>
      <text x="16" y="130">Slept well on the night</text><text x="16" y="146">of 10 to 11 Sep 2026</text>
      <text x="16" y="172" font-size="10" font-weight="600" fill="#55606E">HAPPENED</text>
      <text x="16" y="188">11 Sep 2026, day</text>
      <text x="16" y="212" font-size="10" font-weight="600" fill="#55606E">TAGS</text>
      <text x="16" y="228">health, sleep</text>
    </g>
  </g>

  <g font-size="12" fill="#1F2A44">
    <text x="40" y="492"><tspan font-weight="600">Typo kept in raw, fixed in the claim. </tspan>Relative dates become real dates.</text>
    <text x="40" y="512"><tspan font-weight="600">No inference stored. </tspan>Nothing says padel caused the flare; that's for later.</text>
  </g>

  <!-- Section 2 -->
  <line x1="40" y1="536" x2="720" y2="536" stroke="#D5DCE6"/>
  <text x="40" y="566" font-size="15" font-weight="600" fill="#2F6F8F">2  In October: "Is padel making my tendonitis worse?"</text>

  <g font-size="12" fill="#1F2A44">
    <rect x="40" y="582" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
    <text x="54" y="606" font-size="13" font-weight="600">timeline</text>
    <text x="54" y="628">Weekly counts for padel</text><text x="54" y="646">and tendonitis</text>

    <line x1="242" y1="624" x2="276" y2="624" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

    <rect x="280" y="582" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
    <text x="294" y="606" font-size="13" font-weight="600">recall, view: history</text>
    <text x="294" y="628">The entries behind</text><text x="294" y="646">the counts</text>

    <line x1="482" y1="624" x2="516" y2="624" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

    <rect x="520" y="582" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5"/>
    <text x="534" y="606" font-size="13" font-weight="600">Claude answers</text>
    <text x="534" y="628">e.g. "bad 4 of 5 mornings</text><text x="534" y="646">after padel, 1 of 12 without"</text>
  </g>

  <line x1="620" y1="668" x2="620" y2="700" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="608" y="690" font-size="12" fill="#1F2A44" text-anchor="end">you say "save that"</text>

  <!-- Digest -->
  <rect x="40" y="704" width="680" height="104" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="52" y="716" width="58" height="20" rx="10" fill="#E6F0F4"/><text x="81" y="730" text-anchor="middle" font-size="11" fill="#1F2A44">digest</text>
  <g font-size="12" fill="#1F2A44">
    <text x="124" y="731"><tspan font-weight="600">save_digest: </tspan>raw_text is Claude's synthesis, in its own words</text>
    <text x="124" y="756"><tspan font-weight="600">sources: </tspan>every entry id it used, e.g. 5 padel sessions, 17 mornings</text>
    <text x="124" y="780"><tspan font-weight="600">covers: </tspan>1 Sep to 31 Oct 2026</text>
    <text x="124" y="798" fill="#5C3D0B">Forget any source entry and this digest is deleted with it.</text>
  </g>

  <!-- Comparison -->
  <text x="40" y="848" font-size="15" font-weight="600" fill="#1F2A44">The difference</text>
  <g font-size="12">
    <text x="200" y="872" font-weight="600" fill="#1F2A44">remember</text>
    <text x="460" y="872" font-weight="600" fill="#1F2A44">save_digest</text>
    <line x1="40" y1="880" x2="720" y2="880" stroke="#D5DCE6"/>
    <text x="40" y="900" font-weight="600" fill="#55606E">Whose words</text><text x="200" y="900" fill="#1F2A44">Yours, copied exactly</text><text x="460" y="900" fill="#1F2A44">Claude's, clearly labelled</text>
    <text x="40" y="922" font-weight="600" fill="#55606E">It must</text><text x="200" y="922" fill="#1F2A44">Never paraphrase</text><text x="460" y="922" fill="#1F2A44">Cite every source it used</text>
    <text x="40" y="944" font-weight="600" fill="#55606E">It stores</text><text x="200" y="944" fill="#1F2A44">What happened</text><text x="460" y="944" fill="#1F2A44">What it might mean</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#FFFFFF"/>

  <text x="40" y="42" font-size="20" font-weight="600" fill="#1F2A44">Memento: intelligence at the edges, durability in the middle</text>

  <!-- Column headers -->
  <text x="40" y="84" font-size="13" font-weight="600" fill="#2F6F8F">Write edge (smart)</text>
  <text x="350" y="84" font-size="13" font-weight="600" fill="#3B3B3B">Store (dumb, durable)</text>
  <text x="660" y="84" font-size="13" font-weight="600" fill="#2F6F8F">Read edge (smart)</text>

  <!-- Sources -->
  <g font-size="12" fill="#1F2A44" text-anchor="middle">
    <rect x="40" y="98" width="64" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="72" y="115">Claude</text>
    <rect x="112" y="98" width="76" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="150" y="115">ChatGPT</text>
    <rect x="196" y="98" width="104" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="248" y="115">any MCP client</text>
  </g>
  <line x1="170" y1="126" x2="170" y2="148" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Distil -->
  <rect x="40" y="150" width="260" height="220" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="58" y="180" font-size="15" font-weight="600" fill="#1F2A44">Distil before storing</text>
  <g font-size="13" fill="#1F2A44">
    <text x="58" y="214">Keep the raw words verbatim</text>
    <text x="58" y="242">Extract the claim or intent</text>
    <text x="58" y="270">Date it: happened vs recorded</text>
    <text x="58" y="298">Tag people, places, projects</text>
    <text x="58" y="326">Type: memory, thought, reminder</text>
  </g>

  <line x1="302" y1="260" x2="346" y2="260" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Store -->
  <rect x="350" y="98" width="260" height="272" rx="8" fill="#EEF0F2" stroke="#3B3B3B" stroke-width="2"/>
  <g>
    <rect x="366" y="114" width="228" height="70" rx="6" fill="#FFFFFF" stroke="#3B3B3B"/>
    <text x="380" y="142" font-size="14" font-weight="600" fill="#1F2A44">Raw entry</text>
    <text x="380" y="164" font-size="12" fill="#55606E">Immutable. The source of truth.</text>

    <rect x="366" y="198" width="228" height="70" rx="6" fill="#FFFFFF" stroke="#3B3B3B" stroke-dasharray="5 4"/>
    <text x="380" y="226" font-size="14" font-weight="600" fill="#1F2A44">Derived fields</text>
    <text x="380" y="248" font-size="12" fill="#55606E">Summary, tags, embeddings. Rebuildable.</text>

    <rect x="366" y="282" width="228" height="70" rx="6" fill="#FFFFFF" stroke="#3B3B3B"/>
    <text x="380" y="310" font-size="14" font-weight="600" fill="#1F2A44">Provenance</text>
    <text x="380" y="332" font-size="12" fill="#55606E">Client, model, timestamp, confidence.</text>
  </g>

  <line x1="612" y1="260" x2="656" y2="260" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Interpret -->
  <rect x="660" y="150" width="260" height="220" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="678" y="180" font-size="15" font-weight="600" fill="#1F2A44">Interpret after retrieving</text>
  <g font-size="13" fill="#1F2A44">
    <text x="678" y="214">Retrieve by time, tag, meaning</text>
    <text x="678" y="242">Summarise a period</text>
    <text x="678" y="270">Spot change over months</text>
    <text x="678" y="298">Answer with citations to raw</text>
    <text x="678" y="326">Surface due reminders</text>
  </g>
  <line x1="790" y1="148" x2="790" y2="128" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Outputs -->
  <g font-size="12" fill="#1F2A44" text-anchor="middle">
    <rect x="660" y="98" width="80" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="700" y="115">Answers</text>
    <rect x="750" y="98" width="80" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="790" y="115">Digests</text>
    <rect x="840" y="98" width="80" height="26" rx="13" fill="#E6F0F4" stroke="#2F6F8F"/>
    <text x="880" y="115">Trends</text>
  </g>

  <!-- Warning note -->
  <rect x="350" y="392" width="260" height="52" fill="#FBF3E4"/>
  <rect x="350" y="392" width="4" height="52" fill="#B7791F"/>
  <text x="364" y="413" font-size="12" font-weight="600" fill="#5C3D0B">Leonard lied to himself.</text>
  <text x="364" y="432" font-size="12" fill="#5C3D0B">Anything derived must link back to raw.</text>

  <!-- Timeline -->
  <line x1="40" y1="478" x2="920" y2="478" stroke="#9AA3AE" stroke-width="1.5"/>
  <circle cx="40" cy="478" r="4" fill="#2F6F8F"/>
  <circle cx="920" cy="478" r="4" fill="#2F6F8F"/>
  <text x="40" y="502" font-size="12" fill="#55606E">2026: today's model writes the entry</text>
  <text x="480" y="470" font-size="12" font-weight="600" fill="#1F2A44" text-anchor="middle">The store outlives every model</text>
  <text x="920" y="502" font-size="12" fill="#55606E" text-anchor="end">2030: a better model reads the same entry</text>
</svg>

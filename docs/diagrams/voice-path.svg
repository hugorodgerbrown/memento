<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-weight="600" fill="#1F2A44">The voice path: stored at once, understood later</text>
  <text x="40" y="66" font-size="13" fill="#55606E">The transcript is tattooed the moment Pocket finishes. Interpretation waits for your own LLM.</text>

  <!-- Pocket -->
  <rect x="40" y="100" width="200" height="200" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="56" y="128" font-size="15" font-weight="600" fill="#1F2A44">Pocket</text>
  <g font-size="13" fill="#1F2A44">
    <text x="56" y="160">You tap and speak</text>
    <text x="56" y="186">Pocket transcribes</text>
    <text x="56" y="212">Its model summarises</text>
    <text x="56" y="238">A routing rule decides</text>
    <text x="56" y="256">what reaches Memento</text>
  </g>

  <!-- Webhook arrow -->
  <text x="280" y="162" font-size="11" fill="#1F2A44" text-anchor="middle">webhook</text>
  <line x1="242" y1="170" x2="316" y2="170" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="280" y="188" font-size="10" fill="#55606E" text-anchor="middle">HMAC signed</text>

  <!-- Capture -->
  <rect x="320" y="100" width="300" height="200" rx="8" fill="#FBF3E4" stroke="#B7791F" stroke-width="2"/>
  <text x="336" y="128" font-size="15" font-weight="600" fill="#5C3D0B">Capture (the inbox)</text>
  <g font-size="13" fill="#1F2A44">
    <text x="336" y="160">Transcript, verbatim, with speakers</text>
    <text x="336" y="186">Captured at: the default happened_at</text>
    <text x="336" y="212">Pocket's hints, kept apart from raw</text>
    <text x="336" y="238">Status: inbox, processed, dismissed</text>
    <text x="336" y="264">Unique on recording id: retries are safe</text>
  </g>

  <!-- Inbox arrow -->
  <text x="660" y="162" font-size="11" fill="#1F2A44" text-anchor="middle">inbox</text>
  <line x1="622" y1="170" x2="696" y2="170" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- LLM -->
  <rect x="700" y="100" width="220" height="200" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2"/>
  <text x="716" y="128" font-size="15" font-weight="600" fill="#1F2A44">Your LLM client</text>
  <g font-size="13" fill="#1F2A44">
    <text x="716" y="160">Reads transcript + hints</text>
    <text x="716" y="186">Splits it into entries</text>
    <text x="716" y="212">Fixes misheard names</text>
    <text x="716" y="230">in the claim, not the raw</text>
    <text x="716" y="256">Closes the capture</text>
  </g>

  <!-- LLM -> Entries -->
  <path d="M810,302 V400 H626" fill="none" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="818" y="346" font-size="11" fill="#1F2A44">remember(capture,</text>
  <text x="818" y="362" font-size="11" fill="#1F2A44">exact excerpt) × N</text>

  <!-- Capture -> Entries (cites) -->
  <line x1="470" y1="302" x2="470" y2="366" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="480" y="340" font-size="11" fill="#5C3D0B">each entry points back</text>

  <!-- Entries -->
  <rect x="320" y="370" width="300" height="140" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="336" y="398" font-size="15" font-weight="600" fill="#1F2A44">Entries</text>
  <g font-size="13" fill="#1F2A44">
    <text x="336" y="428">One capture, many entries</text>
    <text x="336" y="454">raw_text is an exact excerpt</text>
    <text x="336" y="480">The server rejects any excerpt</text>
    <text x="336" y="498">not found in the transcript</text>
  </g>

  <!-- Capture -> Email -->
  <path d="M320,280 H280 V440 H244" fill="none" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="288" y="360" font-size="11" fill="#1F2A44" transform="rotate(-90 288 360)" text-anchor="middle">waiting count</text>

  <!-- Email -->
  <rect x="40" y="370" width="200" height="140" rx="8" fill="#EEF0F2" stroke="#9AA3AE"/>
  <text x="56" y="398" font-size="15" font-weight="600" fill="#1F2A44">Morning email</text>
  <g font-size="13" fill="#1F2A44">
    <text x="56" y="428">Due reminders</text>
    <text x="56" y="454">Voice notes waiting</text>
    <text x="56" y="472">to be processed</text>
  </g>

  <!-- Note -->
  <rect x="660" y="420" width="260" height="90" fill="#FBF3E4"/>
  <rect x="660" y="420" width="4" height="90" fill="#B7791F"/>
  <text x="676" y="444" font-size="13" font-weight="600" fill="#5C3D0B">A hint, not a memory</text>
  <g font-size="12" fill="#5C3D0B">
    <text x="676" y="466">Pocket's summary is another</text>
    <text x="676" y="484">model's reading. It helps your</text>
    <text x="676" y="502">LLM, but it is never raw.</text>
  </g>
</svg>

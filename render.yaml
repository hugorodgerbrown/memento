# Render Blueprint: Memento (build plan M1).
#
# This describes the real Memento, the one that holds real memories (ADR 0024).
# Apply from the Render dashboard: New > Blueprint, then pick this repository.
# Nothing here is secret: every value that must stay out of git is marked
# `sync: false` and set once, by hand, in the dashboard. See docs/deploy.md.
#
# The service and the database sit in the same region so they talk over Render's
# private network rather than the public internet.

services:
  - name: memento
    type: web
    runtime: python # Python comes from .python-version (3.14, needed for uuid7)
    region: frankfurt
    plan: 0.5c-512mb # preDeployCommand needs a paid plan
    branch: main
    healthCheckPath: /healthz

    # uv first, then the locked environment, then hashed and compressed static
    # files for WhiteNoise (CompressedManifestStaticFilesStorage insists on them).
    buildCommand: >-
      pip install uv &&
      uv sync --locked &&
      uv run python manage.py collectstatic --no-input

    # Runs on a separate instance after the build and before the new version
    # serves traffic. A failed migration fails the deploy, and the previous
    # version keeps serving.
    preDeployCommand: uv run python manage.py migrate --no-input

    # ASGI from the start, so M2's MCP streamable HTTP endpoint at /mcp is served
    # without changing how the service runs. Gunicorn supervises; uvicorn workers
    # do the serving. Two workers fit 512MB comfortably.
    startCommand: >-
      uv run gunicorn config.asgi:application
      --worker-class uvicorn_worker.UvicornWorker
      --workers 2
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --timeout 120

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memento-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates it once and keeps it
      - key: DJANGO_DEBUG
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      # Pocket is deliberately not connected here yet (0024): the pull's first dry
      # run against the real account comes first. Until this is set in the
      # dashboard, pocket.verify_signature rejects every delivery with a 401,
      # which is the right answer for an unsigned request.
      - key: POCKET_WEBHOOK_SECRET
        sync: false

  # The distiller (M7, ADR 0019): every 15 minutes, turns the last 35 minutes of
  # the inbox into entries. A separate client with its own environment and token;
  # the model provider's key lives here and never on the web service, which
  # refuses to start if it finds one (Principle 2, 0013).
  - name: memento-distiller
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: pip install uv && cd distiller && uv sync --locked
    startCommand: cd distiller && uv run python distil.py
    envVars:
      - key: MEMENTO_URL # https://<the web service>/mcp
        sync: false
      - key: MEMENTO_TOKEN # manage.py create_client <user> distiller (read and write, never forget)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISTILLER_MODEL
        value: claude-sonnet-5

databases:
  - name: memento-db
    plan: 0.1c-256mb
    postgresMajorVersion: "16" # matches docker-compose.yml and CI
    region: frankfurt
    # No external access: the web service reaches it over the private network.
    # For a psql session, open a shell on the service and run `uv run python
    # manage.py dbshell`. Widening this is a deliberate act, not a default, and
    # docs/deploy.md says what to do when a backup needs it opened briefly.
    ipAllowList: []

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memento
          POSTGRES_PASSWORD: memento
          POSTGRES_DB: memento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://memento:memento@localhost:5432/memento
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run python manage.py test
      - name: Distiller tests (its own environment; no model calls)
        working-directory: distiller
        run: |
          uv sync --locked
          uv run python -m unittest -v

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: migrations-check
        name: migrations are up to date
        entry: env DJANGO_DEBUG=1 uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: ^memories/models\.py$
